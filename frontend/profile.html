<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrbitView | Profile</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <div id="app-shell">
    <main id="page-content">
      <div class="page-header">
        <div>
          <h1>Profile</h1>
          <p class="subtitle">Your account details</p>
        </div>
      </div>

      <div class="card" style="max-width:480px;">
        <div class="flex gap-12" style="align-items:center; margin-bottom:20px;">
          <div class="avatar-circle" style="width:56px; height:56px; font-size:20px;" id="profile-avatar">?</div>
          <div>
            <div style="font-size:17px; font-weight:700;" id="profile-username">-</div>
            <div class="text-muted" id="profile-role">-</div>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="text" id="profile-email" disabled />
        </div>

        <div class="form-group">
          <label>Department</label>
          <input type="text" id="profile-department" disabled />
        </div>

        <div class="form-group mb-0">
          <label>Role</label>
          <input type="text" id="profile-role-input" disabled />
        </div>
      </div>

      <div class="form-actions" style="justify-content:flex-start; margin-top:20px;">
        <button class="btn btn-danger" id="profile-logout-btn">Logout</button>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
