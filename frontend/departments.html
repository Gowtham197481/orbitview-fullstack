<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrbitView | Departments</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <div id="app-shell">
    <main id="page-content">
      <div class="page-header">
        <div>
          <h1>Departments</h1>
          <p class="subtitle">Budgets, codes and headcount per department</p>
        </div>
        <button class="btn hidden" id="add-department-btn">+ New Department</button>
      </div>

      <!-- Search & Filter Controls -->
      <div class="filter-bar card">
        <div class="filter-group filter-search">
          <input type="text" id="department-search-input" placeholder="Search departments by name or code..." />
        </div>
        <button class="btn btn-secondary btn-sm hidden" id="clear-dept-filter-btn">Clear Search</button>
      </div>

      <div id="dept-budget-banner" class="alert alert-info hidden" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
        <span><strong>Department Budget Overview:</strong> Review total allocated annual budgets and remaining balances across all departments.</span>
        <button type="button" class="btn btn-secondary btn-sm" id="dismiss-budget-banner-btn" style="padding:4px 10px; font-size:12px;">Dismiss</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Code</th>
              <th>Total Budget</th>
              <th>Remaining Budget</th>
              <th>Employees</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="departments-tbody">
            <tr class="loading-row"><td colspan="7">Loading departments...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add / Edit Department Modal -->
  <div class="modal-overlay" id="department-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="department-modal-title">New Department</h3>
        <button class="modal-close" data-close-modal="department-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-error" id="department-form-alert"></div>
        <form id="department-form">
          <input type="hidden" id="department-id" />
          <div class="form-group">
            <label for="department-name">Name</label>
            <input type="text" id="department-name" placeholder="e.g. Engineering" />
            <div class="field-error" id="department-name-error"></div>
          </div>
          <div class="form-group">
            <label for="department-code">Code</label>
            <input type="text" id="department-code" placeholder="e.g. ENG" maxlength="10" />
            <div class="field-error" id="department-code-error"></div>
          </div>
          <div class="form-group">
            <label for="department-budget">Total Annual Budget</label>
            <input type="number" id="department-budget" min="0" step="0.01" placeholder="e.g. 500000" />
            <div class="field-error" id="department-budget-error"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="department-modal">Cancel</button>
            <button type="submit" class="btn" id="department-form-submit">Save Department</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Add Budget Modal -->
  <div class="modal-overlay" id="budget-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Budget</h3>
        <button class="modal-close" data-close-modal="budget-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-error" id="budget-form-alert"></div>
        <form id="budget-form">
          <input type="hidden" id="budget-department-id" />
          <div class="form-group">
            <label for="budget-amount">Amount to add</label>
            <input type="number" id="budget-amount" min="0.01" step="0.01" placeholder="e.g. 25000" />
            <div class="field-error" id="budget-amount-error"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="budget-modal">Cancel</button>
            <button type="submit" class="btn" id="budget-form-submit">Add Budget</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/departments.js?v=2"></script>
</body>
</html>
