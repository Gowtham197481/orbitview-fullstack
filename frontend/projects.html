<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrbitView | Projects</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <div id="app-shell">
    <main id="page-content">
      <div class="page-header">
        <div>
          <h1>Projects</h1>
          <p class="subtitle">Track budgets, timelines and status across all projects</p>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-secondary" id="refresh-statuses-btn">Refresh Statuses</button>
          <button class="btn hidden" id="add-project-btn">+ New Project</button>
        </div>
      </div>

      <!-- Search & Filter Bar -->
      <div class="filter-bar card">
        <div class="filter-group filter-search">
          <input type="text" id="project-search-input" placeholder="Search by title, department, or description..." />
        </div>
        <div class="filter-group">
          <label for="project-status-filter" class="filter-label">Status:</label>
          <select id="project-status-filter">
            <option value="">All Statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="PROPOSED">Proposed</option>
            <option value="ON_HOLD">On Hold</option>
            <option value="COMPLETED">Completed</option>
            <option value="CANCELLED">Cancelled</option>
            <option value="EXPIRED">Expired</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="project-dept-filter" class="filter-label">Department:</label>
          <select id="project-dept-filter">
            <option value="">All Departments</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm hidden" id="clear-filters-btn">Clear Filters</button>
      </div>

      <div id="filter-banner" class="alert alert-info hidden" style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
        <span id="filter-banner-text">Showing filtered projects</span>
        <button type="button" class="btn btn-secondary btn-sm" id="reset-filter-btn" style="padding:4px 10px; font-size:12px;">Show All Projects</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Department</th>
              <th>Budget</th>
              <th>Start</th>
              <th>End</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="projects-tbody">
            <tr class="loading-row"><td colspan="7">Loading projects...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add / Edit Project Modal -->
  <div class="modal-overlay" id="project-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="project-modal-title">New Project</h3>
        <button class="modal-close" data-close-modal="project-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-error" id="project-form-alert"></div>
        <form id="project-form">
          <input type="hidden" id="project-id" />

          <div class="form-group">
            <label for="project-title">Title</label>
            <input type="text" id="project-title" placeholder="e.g. Customer Portal Revamp" />
            <div class="field-error" id="project-title-error"></div>
          </div>

          <div class="form-group">
            <label for="project-description">Description</label>
            <textarea id="project-description" placeholder="Short description of the project"></textarea>
          </div>

          <div class="form-group">
            <label for="project-department">Department</label>
            <select id="project-department"></select>
            <div class="field-error" id="project-department-error"></div>
          </div>

          <div class="form-group">
            <label for="project-budget">Allocated Budget</label>
            <input type="number" id="project-budget" min="0.01" step="0.01" placeholder="e.g. 75000" />
            <div class="field-error" id="project-budget-error"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="project-start">Start Date</label>
              <input type="date" id="project-start" />
              <div class="field-error" id="project-start-error"></div>
            </div>
            <div class="form-group">
              <label for="project-end">End Date</label>
              <input type="date" id="project-end" />
              <div class="field-error" id="project-end-error"></div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" data-close-modal="project-modal">Cancel</button>
            <button type="submit" class="btn" id="project-form-submit">Save Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/projects.js?v=2"></script>
</body>
</html>
